name: Reconstruction control plane
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: scripts/repo-python scripts/ci.py
